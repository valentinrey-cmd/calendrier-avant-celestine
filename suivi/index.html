<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b0f1f">
<link rel="icon" href="icon-192.png"><title>Suivi · Calendrier de Célestine</title>
<style>
:root{--bg:#1b0f1f;--card:#2a1830;--line:#ffffff1a;--txt:#f6eef8;--mut:#bfa9c6;--or:#f2c45a;--ok:#3ddc84;--ko:#ff5c7a;--blue:#6bb6ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 60% at 50% 0,#3a1838,var(--bg));color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 40px}
.wrap{max-width:760px;margin:0 auto}
h1{font:700 1.35rem Georgia,serif;margin:0;color:var(--or)}
h2{font-size:1rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.tag{font-size:.75rem;padding:3px 8px;border-radius:99px;background:#ffffff14;color:var(--mut);white-space:nowrap}
.tag.test{background:#ff9a1f33;color:#ffc46b}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.live{display:flex;align-items:center;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;background:#666}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 #3ddc8488;animation:pulse 1.6s infinite}
.dot.bg{background:#f2c45a}
@keyframes pulse{70%{box-shadow:0 0 0 10px #3ddc8400}100%{box-shadow:0 0 0 0 #3ddc8400}}
.live b{font-size:1.05rem}.live small{display:block;color:var(--mut)}
.game{margin-top:10px;padding:10px 12px;border-radius:12px;background:#3ddc8418;border:1px solid #3ddc8455}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:#ffffff0d;border-radius:12px;padding:9px 6px;text-align:center}
.tile b{display:block;font-size:1.15rem}.tile small{color:var(--mut);font-size:.72rem}
.lvl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:12px}.lvl .bar{flex:1 0 100%;order:3}
.bar{flex:1;height:8px;background:#ffffff14;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff7ab6,var(--or))}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.cell{aspect-ratio:1;overflow:hidden;line-height:1.15;text-align:center;border-radius:10px;background:#ffffff0a;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;color:var(--mut);position:relative}
.cell b{font-size:.95rem;color:var(--txt)}.cell{font-size:.62rem}
.cell.op{background:#6bb6ff1c;border-color:#6bb6ff55}
.cell.ok{background:#3ddc8424;border-color:#3ddc8477}
.cell.ko{background:#ff5c7a24;border-color:#ff5c7a77}
.cell.now{outline:2px solid var(--or)}
.cell .h{font-size:.6rem;letter-spacing:-1px}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--mut);margin-top:8px}.leg span:before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#ffffff0a}
.row .ic{font-size:1.2rem;width:26px;text-align:center;flex:none}.row .tx{flex:1;min-width:0}.row .tm{color:var(--mut);font-size:.75rem;white-space:nowrap}
.row.used{opacity:.55}
.muted{color:var(--mut)}
.log .row{background:none;padding:6px 2px;border-bottom:1px solid var(--line);border-radius:0}
.log .row.new{animation:flash 2s}
@keyframes flash{from{background:#f2c45a33}to{background:none}}
.day{color:var(--or);font-size:.78rem;font-weight:700;margin:10px 0 2px;text-transform:capitalize}
button{font:inherit;color:inherit;background:#ffffff14;border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}
.err{display:none;color:#ffb3c1;font-size:.85rem;margin-bottom:10px}
@media(max-width:420px){.tile b{font-size:.98rem}.tile{padding:8px 4px}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{padding:12px 8px;border-radius:14px;font-weight:700;font-size:.95rem}.big.atk{background:#2f6b1f;border-color:#58b13b}.big.gft{background:#8f1a3a;border-color:#ff7ab6}.big.on{outline:2px solid var(--or)}
.frm{margin-top:12px;padding:12px;border-radius:14px;background:#00000033}
.frm h3{margin:0 0 4px;font-size:.95rem}.frm .hint{color:var(--mut);font-size:.8rem;margin:0 0 10px}
.it{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.it .ic{width:26px;text-align:center;font-size:1.15rem}.it .nm{flex:1}.it .nm small{display:block;color:var(--mut);font-size:.72rem}
.step{display:flex;align-items:center;gap:4px}.step button{width:34px;height:34px;padding:0;border-radius:10px}.step input{width:58px;text-align:center;font:inherit;color:inherit;background:#ffffff14;border:1px solid var(--line);border-radius:10px;padding:6px 2px}
.ck{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}.ck input{width:20px;height:20px;accent-color:#ff7ab6}
.frm textarea{width:100%;margin-top:10px;font:inherit;color:inherit;background:#ffffff14;border:1px solid var(--line);border-radius:12px;padding:8px;min-height:54px;resize:vertical}
.frm .go{width:100%;margin-top:10px;padding:12px;border-radius:14px;font-weight:700;background:var(--or);color:#2a1205;border:0}
.cell .bm{position:absolute;top:2px;right:3px;font-size:.7rem}
.leg span:last-child:before{display:none}
.sub{color:var(--mut);font-size:.78rem;margin:12px 0 4px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><h1>🎄 Suivi de Célestine</h1><span class="tag" id="room"></span></div>
 <div class="err" id="err"></div>
 <div class="card"><div class="live"><span class="dot" id="dot"></span><div><b id="st">Connexion…</b><small id="st2"></small></div></div><div id="game"></div><div id="fin"></div></div>
 <div class="card"><h2>🔔 Notifications</h2><div id="nbox"></div></div>
 <div class="card" id="bcard" hidden><h2>📊 Bilan de l'aventure</h2><div id="bbox"></div></div>
 <div class="card"><h2>🎮 Actions</h2><div class="acts"><button class="big atk" id="bAtk">😈 Lancer une attaque</button><button class="big gft" id="bGift">🎁 Envoyer un cadeau</button></div><div id="form"></div><div id="sent"></div></div>
 <div class="card"><h2>⭐ Ses compteurs</h2><div class="tiles" id="tiles"></div><div class="lvl"><span id="lvn"></span><div class="bar"><i id="lvb"></i></div><span class="muted" id="lvp"></span></div></div>
 <div class="card"><h2>📅 Le calendrier</h2><div class="grid" id="grid"></div>
  <div class="leg"><span style="--c:#ffffff22">Fermée</span><span style="--c:#6bb6ff">Ouverte</span><span style="--c:#3ddc84">Réussi</span><span style="--c:#ff5c7a">Raté</span><span>👹 boss · 🏆 boss battu</span></div></div>
 <div class="card"><h2>👹 Les boss</h2><div class="list" id="boss"></div></div>
 <div class="card"><h2>🛍️ Ses bons</h2><div class="list" id="bons"></div></div>
 <div class="card"><h2>🧩 Puzzle &amp; niveau secret</h2><div id="puz"></div></div>
 <div class="card"><h2>⚙️ Ses réglages</h2><div id="prefs"></div></div>
 <div class="card log"><h2 style="justify-content:space-between"><span>📜 Activité</span><button id="clr" title="Effacer l'historique">🗑️</button></h2><div id="log"></div></div>
 <p class="muted" style="text-align:center;font-size:.75rem">Mise à jour en direct · ne partage pas ce lien</p>
</div>
<script>
const BASE='https://calendrier-celestine-default-rtdb.europe-west1.firebasedatabase.app/avent-c7v4k9q2/';
const ROOM=new URLSearchParams(location.search).get('room')||'c';
const URL0=BASE+ROOM;
const LEVELS=[[0,"Célesteenager"],[110,"Célestinhaler"],[270,"Célestinégalable"],[460,"Célestinestimable"],[680,"Célestinattendue"],[940,"Célestinachevable"],[1230,"Célestinoubliable"],[1540,"Célestinévitable"],[1900,"Célestinouïe"],[2300,"Célestinarrêtable"]];
const BOSS={4:"💅 Noémie · l’audition aux vernis",8:"👁️ Emma · le test de vue",11:"🌯 Edgar · tacos express",15:"📚 Nora · les fiches de révision",19:"💊 Sandrine · le comptoir de la pharmacie",22:"🚇 Valentin · la course dans le métro"};
const LANG={fr:"🇫🇷 Français",en:"🇬🇧 English",br:"⠃⠗⠁⠊⠇⠇⠑ Braille"};
const TITLES={1:"Memorizotto",2:"Colony Flow",3:"Mots mêlés pimentés",4:"Flappy Célestine",5:"La hutte de Panoramix",6:"Air hockey contre Valentin",7:"Zip",8:"Bulles d’indices",9:"Flèches en fuite",10:"Picross",11:"Simontagne",12:"Le sudokunnilingus",13:"Œil de lynx",14:"La tour de cadeaux",15:"Block blaster",16:"Notre mot fléché",17:"Libère la voiture",18:"Candy Noël",19:"2048",20:"Les 7 différences",21:"Relier les points",22:"Sauve Célestine",23:"Tu me connais par cœur ?",24:"Puzzle final"};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let DB={},seen=new Set(),first=true;
$('#room').textContent=ROOM=='c'?'Appli de Célestine':'Données de test';if(ROOM!='c')$('#room').classList.add('test');
function setPath(p,v){const k=p.split('/').filter(Boolean);if(!k.length){DB=v||{};return}let o=DB;for(let i=0;i<k.length-1;i++){if(typeof o[k[i]]!='object'||!o[k[i]])o[k[i]]={};o=o[k[i]]}if(v===null)delete o[k[k.length-1]];else o[k[k.length-1]]=v}
function patch(p,v){for(const k in v)setPath(p.replace(/\/$/,'')+'/'+k,v[k])}
const ago=t=>{const s=Math.max(0,Math.round((Date.now()-t)/1000));if(s<60)return'à l\'instant';const m=Math.round(s/60);if(m<60)return`il y a ${m} min`;const h=Math.round(m/60);if(h<24)return`il y a ${h} h`;return`il y a ${Math.round(h/24)} j`};
const hm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const dur=t=>{const s=Math.max(0,Math.round((Date.now()-t)/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const VIEWS={cal:'le calendrier',day:'une case du calendrier',puz:'le puzzle',shop:'la boutique',lab:'le labo',casino:'le casino',book:"l'album",me:'ses trésors',set:'les paramètres'};
function renderLive(){const L=DB.live,dot=$('#dot');if(!L){dot.className='dot';$('#st').textContent='Pas encore de nouvelles';$('#st2').textContent="Elle n'a pas encore ouvert la nouvelle version de l'appli.";$('#game').innerHTML='';return}
 const fresh=Date.now()-L.at<75000;const on=fresh&&L.vis;dot.className='dot'+(on?' on':fresh?' bg':'');
 $('#st').textContent=on?'Sur l\'appli en ce moment':fresh?'Appli ouverte en arrière-plan':'Hors ligne';
 $('#st2').textContent=on?`Sur ${VIEWS[L.view]||'l\'appli'}`+(L.sim?` · mode test jour ${L.sim}`:''):`Vue ${ago(L.at)} (${hm(L.at)})`;
 $('#game').innerHTML=on&&L.game?`<div class="game">🎮 <b>Joue au jour ${L.game.d} · ${esc(L.game.t)}</b>${L.game.pr?' <span class="tag">entraînement</span>':''}${L.game.boss?' <span class="tag test">combat final</span>':''}<br><small class="muted">depuis <span id="gdur">${dur(L.game.at)}</span></small></div>`:''}
function renderState(){const s=DB.state;if(!s){$('#tiles').innerHTML='<p class="muted">En attente des premières données…</p>';return}
 const inv=s.inv||{};const T=[['⭐',s.pts,'étoiles'],['🔩',s.scr,'clés'],['💎',s.gem,'gemmes'],['🥚',`${s.eggs}/24`,'œufs'],['🏆',`${s.ach}/${s.achT||'?'}`,'succès'],['🔥',s.streak,'flammes'],['💡',inv.hint||0,'indices'],['🃏',inv.joker||0,'jokers'],['👹',`${Object.keys(s.boss||{}).length}/6`,'boss battus'],['🎬',`${s.vids||0}/${s.vidT||6}`,'vidéos'],['📸',`${s.alb||0}/${s.albT||'?'}`,'souvenirs'],['💾',(s.saves||[]).length,'parties en pause']];
 $('#tiles').innerHTML=T.map(([i,v,l])=>`<div class="tile"><b>${i} ${esc(v)}</b><small>${l}</small></div>`).join('');
 const L=Math.max(0,(s.lvl||1)-1),nx=LEVELS[L+1];$('#lvn').innerHTML=`<b>Niv. ${L+1}</b> · ${esc(s.lvlN||LEVELS[L][1])}`;
 $('#lvb').style.width=(nx?Math.min(100,(s.earned-LEVELS[L][0])/(nx[0]-LEVELS[L][0])*100):100)+'%';$('#lvp').textContent=nx?`${s.earned}/${nx[0]} ⭐ gagnées`:`${s.earned} ⭐ · max !`;
 const op=new Set(s.opened||[]),D=s.days||{};let g='';const last=Math.max(0,...op);
 for(let d=1;d<=24;d++){const x=D[d]||{},c=x.d&&!x.l?'ok':x.l?'ko':op.has(d)?'op':'';const mx=3+(x.e||0);
  const info=x.d&&!x.l?`${x.s}⭐${x.f?`<br>${x.f+1}e essai`:''}`:x.l?'perdu':op.has(d)&&x.f?`<span class="h">${'❤️'.repeat(Math.max(0,mx-x.f))}${'🖤'.repeat(x.f)}</span>`:op.has(d)?'à jouer':'';
  const bb=BOSS[d]?`<span class="bm">${(s.boss||{})[d]?'🏆':'👹'}</span>`:'';g+=`<div class="cell ${c} ${d==last?'now':''}" title="${esc(TITLES[d])}${BOSS[d]?' · boss : '+esc(BOSS[d]):''}">${bb}<b>${d}</b>${info}</div>`}
 $('#grid').innerHTML=g;
 const B=(s.bons||[]).slice().sort((a,b)=>(a.u-b.u)||(b.at-a.at));
 $('#bons').innerHTML=B.length?B.map(b=>`<div class="row ${b.u?'used':''}"><span class="ic">${esc(b.ic)}</span><span class="tx">${esc(b.n)}</span><span class="tm">${b.u?'✅ utilisé':'🎁 à offrir'}${b.at?' · '+new Date(b.at).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):''}</span></div>`).join(''):'<p class="muted" style="margin:0">Aucun bon acheté pour l\'instant.</p>';
 const P=s.puz||{},DN={easy:'Facile',normal:'Moyen',hard:'Difficile'};
 $('#puz').innerHTML=`<div class="row"><span class="ic">🧩</span><span class="tx">${P.diff?`${DN[P.diff]||P.diff} · ${P.done?'<b>terminé</b> ✅':`${P.ok}/24 pièces en place`}`:'Difficulté pas encore choisie'}</span><span class="tm">${P.moves?P.moves+' coups':''}</span></div>
  <div class="row" style="margin-top:6px"><span class="ic">🌟</span><span class="tx">Niveau secret : ${s.secret&&s.secret.done?`terminé · score ${s.secret.score}`:'pas encore fait'}</span></div>
  ${s.sim?`<p class="muted" style="margin:8px 0 0;font-size:.8rem">⚠️ L'appli est en mode test (jour ${s.sim} simulé).</p>`:''}<p class="muted" style="margin:8px 0 0;font-size:.75rem">Dernière synchro ${ago(s.at)}</p>`}
function renderBoss(){try{renderBilan()}catch(e){}const s=DB.state;const el=$('#boss');if(!s){el.innerHTML='';return}const B=s.boss||{},T=s.bossTry||{};
 let h=Object.keys(BOSS).map(d=>`<div class="row ${B[d]?'':'used'}"><span class="ic">${B[d]?'🏆':'⏳'}</span><span class="tx">${esc(BOSS[d])} <small class="muted">· jour ${d}</small></span><span class="tm">${B[d]?'battu · '+new Date(B[d]).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):(T[d]?T[d]+' essai'+(T[d]>1?'s':''):'pas encore')}</span></div>`).join('');
 h+=`<div class="row" style="margin-top:8px;${s.vb?'background:#f2c45a22;border:1px solid #f2c45a66':''}"><span class="ic">${s.vb?'👑':s.machine?'😈':'🔒'}</span><span class="tx"><b>Boss final : Valentin</b><br><small class="muted">${s.vb?'Battu ! Jeu terminé 🎉':s.machine?'Débloqué dans la machine secrète':'Pas encore débloqué (machine secrète du 24)'}</small></span><span class="tm">${s.vb?new Date(s.vb).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' · '+hm(s.vb):''}</span></div>`;
 el.innerHTML=h;
 const st=s.set||{};$('#prefs').innerHTML=`<div class="row"><span class="ic">🌍</span><span class="tx">Langue : <b>${LANG[s.lang||'fr']||s.lang}</b></span></div><div class="row" style="margin-top:6px"><span class="ic">☀️</span><span class="tx">Luminosité ${st.lum??100} % · texte ${({s:'petit',n:'normal',l:'grand'})[st.fsz||'n']}${st.warm?' · lumière douce':''}</span></div><div class="row" style="margin-top:6px"><span class="ic">🔊</span><span class="tx">Sons ${st.snd===false?'coupés':'activés'} · musique ${st.mus===false?'coupée':'activée'}</span></div>${(s.saves||[]).length?`<div class="row" style="margin-top:6px"><span class="ic">💾</span><span class="tx">Parties en pause : ${(s.saves||[]).map(k=>'jour '+String(k).replace(/\D/g,'')).join(', ')}</span></div>`:''}`;
 $('#fin').innerHTML=s.vb?`<div class="game" style="background:#f2c45a22;border-color:#f2c45a88">👑 <b>Jeu terminé !</b> Elle a battu Valentin le ${new Date(s.vb).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})} à ${hm(s.vb)}.</div>`:''}
function renderLog(){const L=Object.entries(DB.log||{}).map(([k,v])=>({k,...v})).sort((a,b)=>b.at-a.at).slice(0,150);
 if(!L.length){$('#log').innerHTML='<p class="muted" style="margin:0">Rien pour l\'instant.</p>';return}
 let h='',lastD='';for(const e of L){const dd=new Date(e.at).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});if(dd!=lastD){h+=`<div class="day">${dd}</div>`;lastD=dd}
  const nw=!first&&!seen.has(e.k);h+=`<div class="row ${nw?'new':''}"><span class="ic">${esc(e.ic)}</span><span class="tx">${esc(e.txt)}${e.sim?' <span class="tag test">test</span>':''}</span><span class="tm">${hm(e.at)}</span></div>`}
 L.forEach(e=>seen.add(e.k));$('#log').innerHTML=h}

const BONS=[["🍫","Un goûter surprise"],["🧽","Je fais la vaisselle (une semaine)"],["💆","Un massage"],["📺","Soirée série : tu choisis, je ne râle pas"],["🍝","Un repas maison préparé par moi"],["🎬","Un ciné de ton choix"],["🎁","Un Lego mystère"],["🔐","Un escape game"],["🍽️","Un resto de ton choix"],["🏴󠁧󠁢󠁳󠁣󠁴󠁿","Une activité en Écosse"]];
const IT=[['pts','⭐','Étoiles',s=>s.pts,10],['scr','🔩','Clés à molette',s=>s.scr,5],['gem','💎','Gemmes',s=>s.gem,1],['hint','💡','Indices',s=>(s.inv||{}).hint||0,1],['joker','🃏','Jokers',s=>(s.inv||{}).joker||0,1],['dbl','✨','Points doublés',s=>(s.inv||{}).dbl||0,1],['jeton','🎟️','Jetons casino',s=>(s.inv||{}).jeton||0,1]];
let MODE=null;
function openForm(m){MODE=MODE==m?null:m;$('#bAtk').classList.toggle('on',MODE=='attack');$('#bGift').classList.toggle('on',MODE=='gift');drawForm()}
function drawForm(){const f=$('#form');if(!MODE){f.innerHTML='';return}const s=DB.state||{},atk=MODE=='attack';
 let h=`<div class="frm"><h3>${atk?'🦹 Que doit voler le pickpocket ?':'🎁 Que mettre dans le cadeau ?'}</h3><p class="hint">${atk?"Il attaquera dès qu'elle aura fini ce qu'elle fait (pas pendant un jeu). Elle devra taper sur lui pendant 10 s… mais il volera quand même ce que tu choisis.":"Un cadeau apparaîtra dès qu'elle sera libre ; elle l'ouvre en tapant dessus."}</p>`;
 for(const [k,ic,n,get,st] of IT){const have=get(s)||0;h+=`<div class="it"><span class="ic">${ic}</span><span class="nm">${n}<small>elle en a ${have}</small></span><span class="step"><button data-k="${k}" data-d="-${st}">−</button><input id="q_${k}" type="number" min="0" ${atk?`max="${have}"`:''} value="0" inputmode="numeric"><button data-k="${k}" data-d="${st}">+</button>${atk?`<button data-k="${k}" data-all="${have}" title="Tout">Tout</button>`:''}</span></div>`}
 if(atk){const B=(s.bons||[]).filter(b=>!b.u);h+=`<div class="sub">Ses bons pas encore utilisés</div>`+(B.length?B.map((b,i)=>`<label class="ck"><input type="checkbox" data-b="${i}"> ${esc(b.ic)} ${esc(b.n)}</label>`).join(''):'<p class="hint" style="margin:4px 0">Elle n\'a aucun bon à voler.</p>');f._bons=B}
 else{h+=`<div class="sub">Bons à offrir</div>`+BONS.map((b,i)=>`<label class="ck"><input type="checkbox" data-b="${i}"> ${b[0]} ${esc(b[1])}</label>`).join('')+`<label class="ck"><input type="checkbox" id="cbOwn"> 💌 <input id="ownTxt" placeholder="Bon personnalisé…" style="flex:1;font:inherit;color:inherit;background:#ffffff14;border:1px solid var(--line);border-radius:10px;padding:6px"></label>`;f._bons=BONS.map(b=>({ic:b[0],n:b[1]}))}
 h+=`<textarea id="msg" placeholder="${atk?'Un petit mot du pickpocket (facultatif)…':'Un petit mot avec le cadeau (facultatif)…'}"></textarea><button class="go" id="send">${atk?'😈 Lancer l\'attaque':'🎁 Envoyer le cadeau'}</button></div>`;
 f.innerHTML=h;
 f.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const i=$('#q_'+b.dataset.k);let v=b.dataset.all!=null?+b.dataset.all:(+i.value||0)+(+b.dataset.d);v=Math.max(0,v);if(i.max!=='')v=Math.min(v,+i.max);i.value=v});
 $('#send').onclick=send}
async function send(){const f=$('#form'),items={};let any=false;for(const [k] of IT){let v=Math.max(0,parseInt($('#q_'+k).value)||0);const i=$('#q_'+k);if(i.max!=='')v=Math.min(v,+i.max);if(v){items[k]=v;any=true}}
 const bons=[...f.querySelectorAll('[data-b]:checked')].map(x=>f._bons[+x.dataset.b]).map(b=>({ic:b.ic,n:b.n,at:b.at||0}));
 if(MODE=='gift'&&$('#cbOwn').checked&&$('#ownTxt').value.trim())bons.push({ic:'💌',n:$('#ownTxt').value.trim()});
 const msg=$('#msg').value.trim();if(!any&&!bons.length&&!msg){alert('Choisis au moins une chose.');return}
 const b=$('#send');b.disabled=true;b.textContent='Envoi…';
 try{const r=await fetch(URL0+'/cmd.json',{method:'POST',body:JSON.stringify({type:MODE,at:Date.now(),items,bons,msg})});if(!r.ok)throw 0;MODE=null;drawForm();$('#bAtk').classList.remove('on');$('#bGift').classList.remove('on')}catch(e){alert("L'envoi a échoué, réessaie.");b.disabled=false;b.textContent='Réessayer'}}
function renderSent(){const C=Object.entries(DB.cmd||{}).map(([k,v])=>({k,...v})).sort((a,b)=>b.at-a.at).slice(0,8);if(!C.length){$('#sent').innerHTML='';return}
 $('#sent').innerHTML='<div class="sub">Derniers envois</div>'+C.map(c=>{const what=[...Object.entries(c.items||{}).map(([k,v])=>{const x=IT.find(i=>i[0]==k);return(x?x[1]:k)+' '+v}),...(c.bons||[]).map(b=>b.ic+' '+b.n)].join(', ')||'un petit mot';
  return`<div class="row"><span class="ic">${c.type=='attack'?'😈':'🎁'}</span><span class="tx">${esc(c.done?(c.done.res||'rien'):what)}${c.done&&c.type=='attack'?`<br><small class="muted">elle a tapé ${c.done.taps} fois</small>`:''}</span><span class="tm">${c.done?'✅ '+hm(c.done.at):'⏳ en attente'}</span></div>`}).join('')}
$('#bAtk').onclick=()=>openForm('attack');$('#bGift').onclick=()=>openForm('gift');
function render(){renderLive();renderState();renderBoss();renderLog();renderSent();first=false}
setInterval(()=>{renderLive();const g=$('#gdur');if(g&&DB.live&&DB.live.game)g.textContent=dur(DB.live.game.at)},1000);
function connect(){let es;try{es=new EventSource(URL0+'.json')}catch(e){return fail()}
 const on=ev=>{try{const m=JSON.parse(ev.data);if(ev.type=='put')setPath(m.path,m.data);else patch(m.path,m.data);$('#err').style.display='none';render()}catch(e){console.error(e)}};
 es.addEventListener('put',on);es.addEventListener('patch',on);
 es.addEventListener('cancel',()=>{fail('Accès refusé par la base (vérifie les règles Firebase).')});
 es.onerror=()=>{if(es.readyState==2){fail();setTimeout(connect,5000)}}}
function fail(m){const e=$('#err');e.textContent=m||'Connexion perdue, nouvel essai…';e.style.display='block'}
$('#clr').onclick=async()=>{if(!confirm("Effacer tout l'historique d'activité ?"))return;try{await fetch(URL0+'/log.json',{method:'DELETE'})}catch(e){alert('Impossible pour le moment')}};
connect();

function renderNotif(){const el=$('#nbox');const A=window.SuiviAndroid;if(!A){el.innerHTML='<p class="muted" style="margin:0">Installe l\'appli de suivi Android pour recevoir une notification quand elle joue.</p>';return}
 let ok=true,tst=false;try{ok=A.notifOk();tst=A.getTest()}catch(e){}
 el.innerHTML=`<p style="margin:0 0 8px">${ok?'✅ Activées':'⚠️ Bloquées par le téléphone'} · tu es prévenu (dans les 15 min environ) quand elle <b>ouvre une case</b>, <b>lance ou réussit un jeu</b>, <b>bat un boss</b> ou <b>accuse quelqu'un</b>.</p>
 <div class="acts">${ok?'<button class="big" id="nT">🔔 Tester</button>':'<button class="big" id="nA">🔓 Autoriser les notifications</button>'}</div>
 <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:.85rem"><input type="checkbox" id="nS" ${tst?'checked':''}> Aussi pour le site de test (notifications marquées [test])</label>`;
 const t=$('#nT');if(t)t.onclick=()=>{try{A.testNotif()}catch(e){}};const a=$('#nA');if(a)a.onclick=()=>{try{A.askNotif()}catch(e){}setTimeout(renderNotif,3000)};$('#nS').onchange=e=>{try{A.setTest(e.target.checked)}catch(_){}}}
function renderBilan(){const s=DB.state,c=$('#bcard');if(!s||!s.vb){c.hidden=true;return}c.hidden=false;const D=s.days||{},V=Object.entries(D),done=V.filter(([d,x])=>x.d&&!x.l),fails=V.reduce((a,[d,x])=>a+(x.f||0),0),first=done.filter(([d,x])=>!x.f).length,hard=V.slice().sort((a,b)=>(b[1].f||0)-(a[1].f||0))[0],bt=Object.values(s.bossTry||{}).reduce((a,b)=>a+b,0),E=s.enq||{};
 const T=[['📅',done.length+'/24','jeux réussis'],['🎯',first,'du premier coup'],['💔',fails,'essais ratés'],['⚔️',bt,'combats de boss'],['⚖️',s.acc??'?','erreurs à l\'accusation'],['❌',E.x??'?','suspects barrés'],['🧵',E.l??'?','fils rouges'],['📝',E.n??'?','notes'],['🥚',s.eggs+'/24','œufs']];
 $('#bbox').innerHTML=`<div class="tiles">${T.map(([i,v,l])=>`<div class="tile"><b>${i} ${esc(v)}</b><small>${l}</small></div>`).join('')}</div>${hard&&hard[1].f?`<p style="margin:8px 0 0">😤 Jour le plus dur : <b>${hard[0]} · ${esc(TITLES[hard[0]]||'')}</b> (${hard[1].f} échecs)</p>`:''}${s.rev?`<p style="margin:6px 0 0">🔦 Elle t'a démasqué le <b>${new Date(s.rev).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</b> à ${hm(s.rev)}</p>`:''}<p style="margin:6px 0 0">👑 Boss final battu le <b>${new Date(s.vb).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</b> à ${hm(s.vb)}</p>`}
renderNotif();addEventListener('focus',renderNotif);
</script>
</body>
