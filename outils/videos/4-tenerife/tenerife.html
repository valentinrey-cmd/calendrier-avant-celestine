<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="960" height="640"></canvas>
<script>
// Vidéo n°4 de l'album : « Notre voyage à Tenerife » (août 2026), un timelapse du voyage.
// draw(t) dessine l'image au temps t (secondes). Les scènes et leurs durées sont dans PLAN, en bas.
const cv = document.getElementById('c'), x = cv.getContext('2d');
const W = 960, H = 640;
const IMG = {};
function load(k, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.onerror = r; i.src = src; }); }
window.ready = Promise.all([load('v', '../../../2026/media/persos/valentin.webp'), load('c', '../../../2026/media/persos/celestine.webp')]);

// ---------- outils ----------
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = n => Array.from({ length: n }, () => [rnd(), rnd(), rnd(), rnd()]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => (1 - Math.cos(Math.PI * clamp(k, 0, 1))) / 2;
const mix = (c1, c2, k) => { const a = c1.match(/\w\w/g).map(h => parseInt(h, 16)), b = c2.match(/\w\w/g).map(h => parseInt(h, 16)); return 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k, 0, 1)))).join(',') + ')'; };
function rr(X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }
function circ(X, Y, r, c) { x.fillStyle = c; x.beginPath(); x.arc(X, Y, r, 0, 7); x.fill(); }
function grad(c1, c2, y0 = 0, y1 = H) { const g = x.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c1); g.addColorStop(1, c2); return g; }
const SKIN = '#f2c3a2', SKINL = '#d99b78';

// ---------- personnage (même style que les autres vidéos) ----------
// o : X,Y (pieds), rot, s, face ('v'|'c'), top, topSkin, bot (pantalon) ou shorts, legL/legR (angles), armL/armR, hair, helmet, mask, hood
function person(o) {
  x.save(); x.translate(o.X, o.Y); x.rotate(o.rot || 0); const s = o.s || 0.6; x.scale(s, s);
  const leg = (side, a) => {
    x.save(); x.translate(side * 20, -150); x.rotate(a);
    if (o.shorts) { x.fillStyle = SKIN; rr(-16, 0, 32, 140, 8); x.fill(); x.fillStyle = o.shorts; rr(-18, -4, 36, 50, 6); x.fill(); }
    else { x.fillStyle = o.bot || '#26365e'; rr(-16, 0, 32, 142, 6); x.fill(); }
    x.fillStyle = o.feet || (o.shorts ? SKIN : '#2f3238'); x.beginPath(); x.ellipse(side * 6, 144, 24, 12, 0, 0, 7); x.fill();
    x.restore();
  };
  leg(-1, o.legL || 0); leg(1, o.legR || 0);
  if (o.hair) { x.fillStyle = o.hair; x.beginPath(); x.moveTo(-50, -325); x.quadraticCurveTo(-58, -410, 0, -418); x.quadraticCurveTo(58, -410, 52, -325); x.lineTo(40, -262); x.lineTo(-42, -262); x.closePath(); x.fill(); }
  x.fillStyle = SKIN; x.fillRect(-12, -298, 24, 22);
  if (o.topSkin) { x.fillStyle = SKIN; rr(-62, -285, 124, 140, 14); x.fill(); if (o.bikini) { x.fillStyle = o.bikini; rr(-50, -262, 44, 30, 10); x.fill(); rr(6, -262, 44, 30, 10); x.fill(); } }
  else { x.fillStyle = o.top; rr(-66, -285, 132, 145, 14); x.fill(); }
  if (o.harness) { x.strokeStyle = '#ffb020'; x.lineWidth = 9; x.beginPath(); x.moveTo(-60, -160); x.lineTo(60, -160); x.moveTo(-20, -160); x.lineTo(-20, -130); x.moveTo(20, -160); x.lineTo(20, -130); x.stroke(); }
  if (o.hood) { x.fillStyle = 'rgba(0,0,0,.18)'; rr(-30, -250, 60, 36, 10); x.fill(); x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 3; x.beginPath(); x.moveTo(-10, -285); x.lineTo(-12, -240); x.moveTo(10, -285); x.lineTo(12, -240); x.stroke(); }
  if (o.logo) { x.fillStyle = '#d7a6c8'; x.beginPath(); x.moveTo(-14, -250); x.lineTo(0, -236); x.lineTo(14, -250); x.lineTo(0, -244); x.fill(); }
  const arm = (side, a) => {
    x.save(); x.translate(side * 58, -272); x.rotate(-a * side);
    x.fillStyle = o.topSkin ? SKIN : o.top; rr(-14, -6, 28, 116, 13); x.fill();
    x.fillStyle = SKIN; x.strokeStyle = SKINL; x.lineWidth = 2; x.beginPath(); x.arc(0, 116, 16, 0, 7); x.fill(); x.stroke();
    x.restore();
  };
  arm(-1, o.armL ?? 0.25); arm(1, o.armR ?? 0.25);
  const im = o.face && IMG[o.face]; const hw = 92, hh = im ? hw * im.height / im.width : 110;
  if (im) x.drawImage(im, -hw / 2, -292 - hh + 8, hw, hh);
  else { circ(0, -340, 46, SKIN); x.fillStyle = '#1d2230'; rr(-40, -356, 80, 22, 10); x.fill(); x.fillStyle = '#7a4a2a'; x.beginPath(); x.arc(0, -316, 10, 0, Math.PI); x.fill(); }
  if (o.helmet) { x.fillStyle = o.helmet; x.beginPath(); x.ellipse(0, -372, 56, 40, 0, Math.PI, 0); x.fill(); x.fillRect(-58, -374, 116, 10); }
  if (o.mask) {
    x.fillStyle = 'rgba(140,220,255,.35)'; x.strokeStyle = '#ff5a3c'; x.lineWidth = 8; rr(-40, -362, 80, 38, 14); x.fill(); x.stroke();
    x.strokeStyle = '#ff5a3c'; x.lineWidth = 5; x.beginPath(); x.moveTo(-46, -344); x.lineTo(46, -344); x.stroke();
    x.strokeStyle = '#ffd23c'; x.lineWidth = 10; x.lineCap = 'round'; x.beginPath(); x.moveTo(44, -330); x.lineTo(54, -330); x.lineTo(54, -410); x.stroke(); x.lineCap = 'butt';
  }

}
function bubble(txt, X, Y, k) {
  if (k <= 0) return;
  x.save(); x.globalAlpha = clamp(k * 4, 0, 1);
  x.font = '800 24px system-ui, -apple-system, "Segoe UI", sans-serif';
  const w = x.measureText(txt).width + 32, h = 44; const bx = clamp(X - w / 2, 10, W - w - 10), by = Y - h - 16;
  const sc = 0.6 + 0.4 * Math.min(1, k * 6); x.translate(X, Y); x.scale(sc, sc); x.translate(-X, -Y);
  x.fillStyle = '#fff'; x.strokeStyle = '#2a3550'; x.lineWidth = 3; rr(bx, by, w, h, 22); x.fill(); x.stroke();
  x.beginPath(); x.moveTo(X - 10, by + h - 2); x.lineTo(X, Y - 2); x.lineTo(X + 12, by + h - 2); x.fill(); x.stroke();
  x.fillStyle = '#fff'; x.fillRect(X - 9, by + h - 4, 20, 5);
  x.fillStyle = '#1d2440'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(txt, bx + w / 2, by + h / 2 + 1);
  x.restore();
}
function caption(txt, u) { // bandeau de lieu, en bas à gauche (u = secondes depuis son apparition)
  if (u <= 0) return; const a = clamp(u * 4, 0, 1), k = u / 1.2;
  x.save(); x.globalAlpha = a; x.textAlign = 'left'; x.font = '800 26px system-ui, sans-serif'; const w = x.measureText(txt).width + 36;
  const X = lerp(-w, 24, ease(u * 2.5)); x.fillStyle = 'rgba(16,24,48,.72)'; rr(X, H - 78, w, 50, 25); x.fill();
  x.fillStyle = '#fff'; x.textBaseline = 'middle'; x.fillText(txt, X + 18, H - 52); x.restore();
}
function bigWord(txt, X, Y, k, col) {
  if (k <= 0 || k >= 1) return;
  x.save(); x.translate(X, Y); const sc = k < 0.2 ? k / 0.2 * 1.2 : 1.2 - (k - 0.2) * 0.25; x.scale(sc, sc); x.rotate(-0.1);
  x.globalAlpha = k > 0.75 ? (1 - k) / 0.25 : 1; x.font = '900 60px "Lilita One", system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 10; x.strokeStyle = '#1d2440'; x.strokeText(txt, 0, 0); x.fillStyle = col || '#fff'; x.fillText(txt, 0, 0); x.restore();
}
function teide(X, Y, w, h, c, top, snow) { // silhouette du Teide (cône + Pico Viejo)
  x.fillStyle = c; x.beginPath(); x.moveTo(X - w, Y); x.lineTo(X - w * 0.45, Y - h * 0.48); x.lineTo(X - w * 0.3, Y - h * 0.5); x.lineTo(X - w * 0.1, Y - h * 0.94);
  x.lineTo(X - w * 0.03, Y - h); x.lineTo(X + w * 0.04, Y - h); x.lineTo(X + w * 0.12, Y - h * 0.93); x.lineTo(X + w * 0.55, Y - h * 0.3); x.lineTo(X + w, Y); x.fill();
  if (top) { x.fillStyle = top; x.beginPath(); x.moveTo(X - w * 0.1, Y - h * 0.94); x.lineTo(X - w * 0.03, Y - h); x.lineTo(X + w * 0.04, Y - h); x.lineTo(X + w * 0.12, Y - h * 0.93); x.lineTo(X + w * 0.07, Y - h * 0.86); x.lineTo(X, Y - h * 0.9); x.lineTo(X - w * 0.06, Y - h * 0.86); x.fill(); }
}
function palm(X, Y, s, sway) {
  x.strokeStyle = '#8a6a44'; x.lineWidth = 12 * s; x.lineCap = 'round'; x.beginPath(); x.moveTo(X, Y); x.quadraticCurveTo(X + 20 * s, Y - 90 * s, X + 10 * s + sway, Y - 170 * s); x.stroke(); x.lineCap = 'butt';
  const tx = X + 10 * s + sway, ty = Y - 170 * s; x.fillStyle = '#2f8f4e';
  for (let i = 0; i < 7; i++) { const a = -Math.PI + i * Math.PI / 6 + Math.sin(sway * 0.05 + i) * 0.05; x.save(); x.translate(tx, ty); x.rotate(a); x.beginPath(); x.ellipse(45 * s, 8 * s, 50 * s, 12 * s, 0.25, 0, 7); x.fill(); x.restore(); }
}
function clouds(y, t, sp, col, n, sz) { x.fillStyle = col; for (let i = 0; i < n; i++) { const cx = ((i * 197 + t * sp) % (W + 400)) - 200; for (let j = 0; j < 4; j++) { x.beginPath(); x.arc(cx + j * 38 * sz, y + Math.sin(i + j) * 10, (34 + (j % 2) * 16) * sz, 0, 7); x.fill(); } } }
function seaOfClouds(y, t, light) { // la « mer de nuages »
  x.fillStyle = light || '#f4f1ee'; x.fillRect(0, y + 20, W, H - y);
  for (let i = -1; i < 14; i++) { const cx = i * 80 + ((t * 10) % 80); x.beginPath(); x.arc(cx, y + 22, 52 + (i % 3) * 10, Math.PI, 0); x.fill(); }
}

// ---------- la carte de Tenerife (entre les scènes) ----------
// Contour simplifié de l'île (Teno au nord-ouest, Anaga au nord-est, la pointe sud vers El Médano)
const ISLE = [[120, 270], [150, 225], [205, 210], [260, 232], [330, 236], [400, 222], [470, 214], [540, 196], [610, 160], [680, 128], [740, 100], [800, 76], [860, 70], [872, 92], [830, 118], [770, 150], [715, 196], [672, 250], [640, 312], [612, 380], [585, 445], [550, 500], [512, 548], [470, 585], [432, 600], [400, 585], [360, 548], [310, 505], [255, 470], [205, 438], [160, 400], [128, 340]];
const SPOTS = { // emplacements sur la carte
  plage: [235, 460, '🏖️'], snorkel: [200, 410, '🤿'], siam: [262, 482, '🌊'], canyon: [520, 255, '🧗'], parapente: [520, 300, '🪂'], anaga: [770, 120, '🌿'], teide: [400, 330, '🌋'],
};
function drawMap(t, from, to, k, label) {
  x.fillStyle = grad('#7ec8f2', '#3d8fd0'); x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(255,255,255,.25)'; x.lineWidth = 2; for (let i = 0; i < 6; i++) { x.beginPath(); for (let X = 0; X <= W; X += 20) x.lineTo(X, 80 + i * 100 + Math.sin(X / 60 + t * 2 + i) * 6); x.stroke(); }
  x.save(); x.translate(10, 20);
  x.fillStyle = '#e9d9a8'; x.strokeStyle = '#fff'; x.lineWidth = 6; x.beginPath(); ISLE.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); x.fill(); x.stroke();
  x.fillStyle = '#8fbf6a'; x.beginPath(); x.ellipse(720, 150, 90, 30, -0.5, 0, 7); x.fill(); x.beginPath(); x.ellipse(170, 250, 50, 28, 0.3, 0, 7); x.fill();
  x.fillStyle = '#b7895a'; x.beginPath(); x.ellipse(410, 330, 120, 70, -0.1, 0, 7); x.fill();
  teide(405, 340, 60, 70, '#7a4f33', '#fff');
  const done = PLAN.filter(p => p.spot && p.t1 <= t).map(p => p.spot);
  for (const k2 of Object.keys(SPOTS)) { const [a, b, e] = SPOTS[k2]; const on = done.includes(k2) || k2 == to; circ(a, b, on ? 22 : 0, '#fff'); if (on) { x.font = '24px system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(e, a, b + 1); } }
  if (from && to) { const [a, b] = SPOTS[from], [c, d] = SPOTS[to]; x.setLineDash([8, 10]); x.strokeStyle = '#e0283f'; x.lineWidth = 4; x.beginPath(); x.moveTo(a, b); x.quadraticCurveTo((a + c) / 2, Math.min(b, d) - 80, lerp(a, c, ease(k)), lerp(b, d, ease(k)) - Math.sin(Math.PI * ease(k)) * 40); x.stroke(); x.setLineDash([]); }
  if (to) { const [c, d] = SPOTS[to]; const kk = from ? ease(k) : 1; const [a, b] = from ? SPOTS[from] : [c, d]; const px = lerp(a, c, kk), py = lerp(b, d, kk) - Math.sin(Math.PI * kk) * 40 - 30; x.fillStyle = '#e0283f'; x.beginPath(); x.arc(px, py, 16, Math.PI, 0); x.lineTo(px, py + 26); x.closePath(); x.fill(); circ(px, py, 6, '#fff'); }
  x.restore();
  x.font = 'italic 700 40px Georgia, serif'; x.textAlign = 'center'; x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowOffsetY = 3; x.fillText('Tenerife · août 2026', W / 2, 60); x.shadowColor = 'transparent';
  if (label) caption(label, 1);
}

// ---------- les scènes ----------
function sPlage(u, D) { // la plage, le Teide au loin, le soleil traverse le ciel
  const k = u / D, sunX = lerp(120, 840, k), sunY = 170 - Math.sin(k * Math.PI) * 90;
  x.fillStyle = grad('#5fb6f0', '#cfeefe', 0, 380); x.fillRect(0, 0, W, H);
  circ(sunX, sunY, 46, '#fff4b0'); circ(sunX, sunY, 34, '#ffe066');
  clouds(80, u * 3, 40, 'rgba(255,255,255,.9)', 5, 0.7);
  teide(700, 330, 230, 190, '#9a7d6a', '#e9e3dc');
  x.fillStyle = '#1e8cc9'; x.fillRect(0, 320, W, 80); x.fillStyle = '#3aa7de'; for (let i = 0; i < 12; i++) { x.fillRect(((i * 120 + u * 60) % (W + 100)) - 50, 340 + (i % 3) * 18, 60, 4); }
  x.fillStyle = '#f2d59b'; x.beginPath(); x.moveTo(0, 390); for (let X = 0; X <= W; X += 40) x.lineTo(X, 392 + Math.sin(X / 90 + u * 2) * 5); x.lineTo(W, H); x.lineTo(0, H); x.fill();
  palm(90, 520, 1.1, Math.sin(u * 1.5) * 6); palm(880, 500, 0.9, Math.sin(u * 1.3 + 1) * 6);
  // parasol + serviette
  x.strokeStyle = '#eee'; x.lineWidth = 6; x.beginPath(); x.moveTo(640, 560); x.lineTo(660, 400); x.stroke();
  for (let i = 0; i < 6; i++) { x.fillStyle = i % 2 ? '#fff' : '#e0283f'; x.beginPath(); x.moveTo(660, 395); x.arc(660, 420, 120, Math.PI + i * Math.PI / 6, Math.PI + (i + 1) * Math.PI / 6); x.fill(); }
  x.fillStyle = '#3fb6b0'; x.save(); x.translate(560, 560); x.rotate(-0.05); rr(-120, -18, 240, 36, 6); x.fill(); x.restore();
  // Valentin enterré dans le sable, Célestine qui rit à côté
  x.fillStyle = '#e7c58a'; x.beginPath(); x.ellipse(330, 548, 140, 40, 0, Math.PI, 0); x.fill();
  const im = IMG.v; if (im) x.drawImage(im, 186, 440 + Math.sin(u * 3) * 2, 64, 64 * im.height / im.width);
  x.fillStyle = '#d6b072'; [[300, 530], [360, 522], [420, 532]].forEach(([a, b]) => { x.beginPath(); x.arc(a, b, 16, Math.PI, 0); x.fill(); });
  x.fillStyle = '#c99c5a'; x.fillRect(440, 488, 34, 40); x.fillRect(436, 482, 10, 8); x.fillRect(452, 482, 10, 8); x.fillRect(468, 482, 10, 8); // château
  person({ X: 520, Y: 600, s: 0.5, face: 'c', topSkin: 1, bikini: '#ff6fa8', shorts: '#ff6fa8', hair: '#4a2a18', armL: 1.2 + Math.sin(u * 6) * 0.2, armR: 0.5, legL: 0.1, legR: -0.1 });
  if (u > 0.8 && u < 3) bubble('Bouge pas, c’est artistique ! 😂', 520, 380, Math.min(u - 0.8, 3 - u));
  if (u > 2.9) bubble('Sortez-moi de là ! 😩', 220, 430, Math.min(u - 2.9, D - u));
}
function sSnorkel(u, D) { // sous l'eau, avec une tortue
  x.fillStyle = grad('#2bb6d8', '#0a4f86'); x.fillRect(0, 0, W, H);
  for (let i = 0; i < 6; i++) { x.fillStyle = 'rgba(255,255,255,.07)'; x.beginPath(); const a = 120 + i * 150 + Math.sin(u + i) * 20; x.moveTo(a, 0); x.lineTo(a + 60, 0); x.lineTo(a - 60, H); x.lineTo(a - 140, H); x.fill(); }
  x.fillStyle = '#d9c38f'; x.beginPath(); x.moveTo(0, 560); for (let X = 0; X <= W; X += 40) x.lineTo(X, 560 + Math.sin(X / 70) * 12); x.lineTo(W, H); x.lineTo(0, H); x.fill();
  x.fillStyle = '#2e2a2e'; [[120, 560, 90, 50], [700, 570, 120, 60], [880, 560, 70, 40]].forEach(([a, b, w, h]) => { x.beginPath(); x.ellipse(a, b, w, h, 0, Math.PI, 0); x.fill(); });
  x.strokeStyle = '#2f8f5b'; x.lineWidth = 5; for (let i = 0; i < 14; i++) { const a = 40 + i * 70; x.beginPath(); x.moveTo(a, 575); x.quadraticCurveTo(a + Math.sin(u * 2 + i) * 14, 535, a + Math.sin(u * 2 + i) * 18, 505); x.stroke(); }
  // bancs de poissons
  for (let i = 0; i < 18; i++) { const fx = (i * 83 + u * (60 + (i % 3) * 20)) % (W + 80) - 40, fy = 120 + (i % 6) * 55 + Math.sin(u * 3 + i) * 8; x.fillStyle = ['#ffd23c', '#ff8a3c', '#7fe0ff'][i % 3]; x.beginPath(); x.ellipse(fx, fy, 14, 7, 0, 0, 7); x.fill(); x.beginPath(); x.moveTo(fx - 12, fy); x.lineTo(fx - 22, fy - 7); x.lineTo(fx - 22, fy + 7); x.fill(); }
  // la tortue
  const tx = lerp(1060, -160, u / D), ty = 450 + Math.sin(u * 1.5) * 16, fl = Math.sin(u * 4) * 0.5;
  x.save(); x.translate(tx, ty); x.scale(-1, 1);
  x.fillStyle = '#7fa65a'; [[-50, -30, fl], [-50, 30, -fl], [50, -26, -fl * 0.6], [50, 26, fl * 0.6]].forEach(([a, b, r]) => { x.save(); x.translate(a, b); x.rotate(r + (b < 0 ? -0.6 : 0.6)); x.beginPath(); x.ellipse(0, b < 0 ? -22 : 22, 18, 40, 0, 0, 7); x.fill(); x.restore(); });
  x.beginPath(); x.ellipse(-92, 0, 26, 20, 0, 0, 7); x.fill(); circ(-102, -6, 4, '#222');
  x.fillStyle = '#6b4a2a'; x.beginPath(); x.ellipse(0, 0, 80, 56, 0, 0, 7); x.fill(); x.strokeStyle = '#a8814f'; x.lineWidth = 4;
  [[0, 0, 26, 20], [-44, -10, 18, 16], [44, -10, 18, 16], [-30, 30, 18, 14], [30, 30, 18, 14]].forEach(([a, b, w, h]) => { x.beginPath(); x.ellipse(a, b, w, h, 0, 0, 7); x.stroke(); });
  x.restore();
  // Célestine et Valentin qui nagent (masque + tuba)
  const sw = Math.sin(u * 5) * 0.25;
  person({ X: 300 + u * 12, Y: 170, rot: -Math.PI / 2 + 0.1, s: 0.42, face: 'c', topSkin: 1, bikini: '#ff6fa8', shorts: '#ff6fa8', hair: '#4a2a18', mask: 1, armL: 2.6, armR: 0.3, legL: sw, legR: -sw, feet: '#2b6fe0' });
  person({ X: 380 + u * 12, Y: 300, rot: -Math.PI / 2 + 0.05, s: 0.42, face: 'v', topSkin: 1, shorts: '#e0283f', mask: 1, armL: 2.8, armR: 0.2, legL: -sw, legR: sw, feet: '#2b6fe0' });
  for (let i = 0; i < 10; i++) { const k = (u * 0.8 + i * 0.1) % 1; circ(470 + u * 12 + Math.sin(i * 3) * 10, 300 - 130 - k * 140 - 40, 4 + (i % 3) * 2, 'rgba(255,255,255,.6)'); }
  if (u > 0.8 && u < 3.2) bubble('Une tortue !! 🐢', 360, 90, Math.min(u - 0.8, 3.2 - u));
}
function sSiam(u, D) { // Siam Park : le temple thaï et la Tower of Power
  x.fillStyle = grad('#4fb2ee', '#d4f0ff', 0, 420); x.fillRect(0, 0, W, H);
  clouds(70, u * 2, 30, 'rgba(255,255,255,.9)', 5, 0.6);
  palm(60, 470, 1.2, Math.sin(u) * 5); palm(910, 460, 1.0, Math.sin(u + 2) * 5);
  // le temple
