<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="960" height="640"></canvas>
<script src="decors.js"></script>
<script>
// ---------- le montage ----------
const SC = [ // [fonction, durée, nom affiché, sous-titre]
  [sIntro, 4.6, null],
  [sPlage, 6.4, 'La plage', 'Le sable chaud, puis les tortues sous l’eau'],
  [sCoucher, 5.6, 'Coucher de soleil sur le Teide', 'Au-dessus de la mer de nuages'],
  [sEtoiles, 6.2, 'Sous les étoiles', 'La Voie lactée, au pied du Teide'],
  [sSiam, 5.2, 'Siam Park', 'La Tower of Power et la Wave Palace'],
  [sRappel, 5.2, 'Descente en rappel', 'Entre les parois de cendres volcaniques'],
  [sAnaga, 5.4, 'La forêt d’Anaga', 'La laurisylve et sa brume'],
  [sParapente, 5.6, 'Parapente', 'Depuis les pentes du Teide, au-dessus des nuages'],
  [sSantiago, 5.0, 'Santiago del Teide', 'L’église San Fernando Rey et ses coupoles blanches'],
  [sMasca, 5.8, 'Masca', 'Le village perché dans les montagnes du Teno'],
  [sOutro, 6.0, null],
];
const XF = 0.9; // fondu enchaîné entre deux étapes
const PLAN = []; { let t = 0; SC.forEach(([f, d, n, sub], i) => { PLAN.push({ f, t0: t, t1: t + d, n, sub, step: i }); t += d - XF; }); }
const DUR = PLAN[PLAN.length - 1].t1;
const NSTEP = SC.filter(s => s[2]).length;
function renderScene(p, t, ctx) {
  x = ctx; const u = t - p.t0, D = p.t1 - p.t0;
  x.save(); x.clearRect(0, 0, W, H);
  // léger travelling (zoom lent) pour donner vie à chaque plan
  const z = 1 + 0.05 * (u / D); x.translate(W / 2, H / 2); x.scale(z, z); x.translate(-W / 2, -H / 2);
  x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.lineCap = 'butt'; x.setLineDash([]); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  p.f(u, D);
  x.restore();
  if (p.n) placeCard(p.step, NSTEP, p.n, p.sub, u, D);
}
function draw(t) {
  const act = PLAN.filter(p => t >= p.t0 && t < p.t1);
  M.globalAlpha = 1; M.fillStyle = '#000'; M.fillRect(0, 0, W, H);
  act.forEach((p, i) => {
    const buf = i ? bufB : bufA; renderScene(p, t, buf.getContext('2d'));
    const a = i ? smooth(p.t0, p.t0 + XF, t) : 1; M.globalAlpha = a; M.drawImage(buf, 0, 0); M.globalAlpha = 1;
  });
  // finitions : vignette, grain, fondus d'ouverture et de fermeture
  const vg = M.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.7); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.42)'); M.fillStyle = vg; M.fillRect(0, 0, W, H);
  M.save(); M.globalAlpha = 0.05; M.globalCompositeOperation = 'overlay'; const ox = Math.floor(t * 97) % 256, oy = Math.floor(t * 61) % 256; for (let X = -ox; X < W; X += 256) for (let Y = -oy; Y < H; Y += 256) M.drawImage(GRAIN, X, Y); M.restore();
  if (t < 0.8) { M.fillStyle = 'rgba(0,0,0,' + (1 - t / 0.8) + ')'; M.fillRect(0, 0, W, H); }
  if (t > DUR - 1.2) { M.fillStyle = 'rgba(0,0,0,' + clamp((t - (DUR - 1.2)) / 1.2, 0, 1) + ')'; M.fillRect(0, 0, W, H); }
}
window.draw = draw; window.DUR = DUR; window.PLAN = PLAN.map(p => [p.n, +p.t0.toFixed(2), +p.t1.toFixed(2)]);
</script></body></html>
