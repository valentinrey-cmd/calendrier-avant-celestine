<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="960" height="640"></canvas>
<script>
// Vidéo n°4 de l'album : « Notre voyage à Tenerife » (août 2026).
// Style « carnet de voyage illustré » : paysages en couches, lumière, brume, petites silhouettes du couple.
// draw(t) dessine l'image au temps t. L'ordre des étapes et leurs durées sont dans SC (en bas).
const W = 960, H = 640;
const main = document.getElementById('c'), M = main.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const bufA = mk(), bufB = mk();
let x = M; // contexte de dessin courant (les scènes dessinent dans x)
const IMG = {};
function load(k, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.onerror = r; i.src = src; }); }
window.ready = Promise.all([load('photo', '../../../2026/media/album/tenerife.jpg'), document.fonts.load('italic 600 40px "Crimson Text"'), document.fonts.load('300 20px Inter'), document.fonts.load('600 20px Inter')]);

// ---------- outils ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => (1 - Math.cos(Math.PI * clamp(k, 0, 1))) / 2;
const smooth = (a, b, v) => { const k = clamp((v - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
const hex = h => h.match(/\w\w/g).map(v => parseInt(v, 16));
const rgba = (h, a) => { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function vgrad(stops, y0 = 0, y1 = H) { const g = x.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function glow(X, Y, r, col, a = 1) { const g = x.createRadialGradient(X, Y, 0, X, Y, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); x.fillStyle = g; x.fillRect(X - r, Y - r, 2 * r, 2 * r); }
function circ(X, Y, r) { x.beginPath(); x.arc(X, Y, r, 0, 7); x.fill(); }
// crête de montagne douce (somme de sinus), remplie jusqu'en bas
function ridge(y, amp, seed, freq, fill, x0 = 0) {
  x.fillStyle = fill; x.beginPath(); x.moveTo(-20, H + 20);
  for (let X = -20; X <= W + 20; X += 8) { const p = (X + x0) * freq; const v = Math.sin(p + seed) * 0.5 + Math.sin(p * 2.3 + seed * 1.7) * 0.28 + Math.sin(p * 5.1 + seed * 0.3) * 0.12; x.lineTo(X, y - v * amp); }
  x.lineTo(W + 20, H + 20); x.fill();
}
function teide(X, Y, w, h, fill, cap) { // le Teide : cône principal + épaule du Pico Viejo à gauche
  x.fillStyle = fill; x.beginPath(); x.moveTo(X - w * 1.3, Y);
  x.bezierCurveTo(X - w * 0.9, Y - h * 0.32, X - w * 0.62, Y - h * 0.46, X - w * 0.4, Y - h * 0.5);
  x.bezierCurveTo(X - w * 0.28, Y - h * 0.55, X - w * 0.16, Y - h * 0.8, X - w * 0.06, Y - h);
  x.lineTo(X + w * 0.06, Y - h); x.bezierCurveTo(X + w * 0.2, Y - h * 0.72, X + w * 0.5, Y - h * 0.35, X + w * 1.2, Y); x.fill();
  if (cap) { x.fillStyle = cap; x.beginPath(); x.moveTo(X - w * 0.06, Y - h); x.lineTo(X + w * 0.06, Y - h); x.lineTo(X + w * 0.13, Y - h * 0.86); x.lineTo(X + w * 0.04, Y - h * 0.9); x.lineTo(X - w * 0.03, Y - h * 0.84); x.lineTo(X - w * 0.11, Y - h * 0.88); x.fill(); }
}
function cloudBank(y, t, sp, top, bottom, seed, scale = 1, n = 16) { // mer de nuages
  const R = rand(seed);
  const g = x.createLinearGradient(0, y - 60 * scale, 0, y + 80 * scale); g.addColorStop(0, top); g.addColorStop(1, bottom); x.fillStyle = g;
  x.beginPath(); x.moveTo(-50, H + 10);
  for (let i = 0; i <= n; i++) { const X = i * (W + 200) / n - 100 + ((t * sp) % ((W + 200) / n)); const r = (40 + R() * 50) * scale; x.lineTo(X - r, y); x.arc(X, y - r * 0.15, r, Math.PI, 0); }
  x.lineTo(W + 50, H + 10); x.fill();
}
function palm(X, Y, s, sway, col) {
  x.strokeStyle = col; x.fillStyle = col; x.lineWidth = 7 * s; x.lineCap = 'round';
  const tx = X + 30 * s + sway, ty = Y - 190 * s;
  x.beginPath(); x.moveTo(X, Y); x.quadraticCurveTo(X + 30 * s, Y - 100 * s, tx, ty); x.stroke();
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI * 0.95 + i * Math.PI / 8 + Math.sin(sway * 0.08 + i) * 0.06;
    const ex = tx + Math.cos(a) * 85 * s, ey = ty + Math.sin(a) * 40 * s + 28 * s * Math.abs(Math.cos(a));
    x.lineWidth = 3 * s; x.beginPath(); x.moveTo(tx, ty); x.quadraticCurveTo(tx + Math.cos(a) * 50 * s, ty + Math.sin(a) * 50 * s - 14 * s, ex, ey); x.stroke();
    for (let j = 1; j < 8; j++) { const k = j / 8, px = lerp(tx, ex, k), py = lerp(ty, ey, k) - Math.sin(k * Math.PI) * 14 * s; x.beginPath(); x.ellipse(px, py + 6 * s, 3 * s, 12 * s * (1 - k * 0.5), a + 1.2, 0, 7); x.fill(); x.beginPath(); x.ellipse(px, py - 6 * s, 3 * s, 12 * s * (1 - k * 0.5), a - 1.2, 0, 7); x.fill(); }
  }
  x.lineCap = 'butt';
}
function pine(X, Y, s, col) { // pin des Canaries (silhouette)
  x.fillStyle = col; x.fillRect(X - 3 * s, Y - 30 * s, 6 * s, 30 * s);
  for (let i = 0; i < 7; i++) { const yy = Y - 25 * s - i * 22 * s, w = (34 - i * 4) * s; x.beginPath(); x.moveTo(X - w, yy); x.quadraticCurveTo(X, yy - 26 * s, X + w, yy); x.quadraticCurveTo(X, yy - 10 * s, X - w, yy); x.fill(); x.beginPath(); x.ellipse(X, yy - 8 * s, w * 0.8, 10 * s, 0, 0, 7); x.fill(); }
  x.beginPath(); x.moveTo(X - 6 * s, Y - 175 * s); x.lineTo(X, Y - 200 * s); x.lineTo(X + 6 * s, Y - 175 * s); x.fill();
}

// ---------- les silhouettes du couple ----------
// o : X,Y (pieds), s (taille), who ('v'|'c'), top/bot (vêtements), sil (couleur unie, pour les contre-jours), rim (liseré lumineux), pose
function figure(o) {
  const s = o.s || 1, P = o.pose || {};
  const draw = (fill, dx) => {
    x.save(); x.translate(o.X + dx, o.Y); x.rotate(P.rot || 0);
    const skin = fill || '#e9b796', top = fill || o.top, bot = fill || o.bot, hair = fill || (o.who == 'c' ? '#4a2a18' : '#231a14');
    x.lineCap = 'round';
    const leg = (a, b) => { x.strokeStyle = bot; x.lineWidth = 9 * s; x.beginPath(); x.moveTo(a * 5 * s, -46 * s); const kx = a * 5 * s + Math.sin(b) * 22 * s, ky = -46 * s + Math.cos(b) * 22 * s; x.lineTo(kx, ky); x.lineTo(kx + Math.sin(b) * 2 * s, ky + 22 * s); x.stroke(); };
    if (P.sit) { x.strokeStyle = bot; x.lineWidth = 9 * s; x.beginPath(); x.moveTo(-4 * s, -18 * s); x.lineTo(14 * s, -20 * s); x.lineTo(16 * s, 0); x.moveTo(4 * s, -18 * s); x.lineTo(20 * s, -18 * s); x.lineTo(24 * s, 0); x.stroke(); }
    else { leg(-1, P.l1 || 0); leg(1, P.l2 || 0); }
    const by = P.sit ? 28 * s : 0;
    x.fillStyle = top; x.beginPath(); x.roundRect(-11 * s, -84 * s + by, 22 * s, 40 * s, 8 * s); x.fill();
    const arm = (side, a) => { x.strokeStyle = top; x.lineWidth = 7 * s; x.beginPath(); x.moveTo(side * 9 * s, -78 * s + by); const ex = side * 9 * s + Math.sin(a) * side * 30 * s, ey = -78 * s + by + Math.cos(a) * 30 * s; x.lineTo(ex, ey); x.stroke(); x.fillStyle = skin; circ(ex, ey, 3.6 * s); };
    arm(-1, P.a1 ?? 0.15); arm(1, P.a2 ?? 0.15);
    x.fillStyle = skin; circ(0, -95 * s + by, 10 * s);
    x.fillStyle = hair;
    if (o.who == 'c') { x.beginPath(); x.ellipse(0, -97 * s + by, 11.5 * s, 11 * s, 0, Math.PI * 1.02, Math.PI * 1.98); x.fill(); x.beginPath(); x.moveTo(-11 * s, -98 * s + by); x.quadraticCurveTo(-14 * s, -70 * s + by, -9 * s + (P.wind || 0), -62 * s + by); x.lineTo(9 * s + (P.wind || 0), -62 * s + by); x.quadraticCurveTo(14 * s, -70 * s + by, 11 * s, -98 * s + by); x.fill(); }
    else { x.beginPath(); x.ellipse(0, -99 * s + by, 10.5 * s, 8 * s, 0, Math.PI, 0); x.fill(); circ(0, -96 * s + by, 9.5 * s); }
    if (o.helmet) { x.fillStyle = fill || o.helmet; x.beginPath(); x.ellipse(0, -100 * s + by, 12 * s, 9 * s, 0, Math.PI, 0); x.fill(); }
    x.restore();
  };
  if (o.rim) draw(o.rim, -1.4 * s);
  draw(o.sil || null, 0);
}

// ---------- texte : carte de lieu élégante ----------
function placeCard(step, total, name, sub, u, D) {
  const a = smooth(0.3, 1.0, u) * (1 - smooth(D - 1.0, D - 0.35, u));
  if (a <= 0) return;
  x.save(); x.globalAlpha = a;
  const X = 44, Y = H - 92;
  x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 14;
  x.fillStyle = 'rgba(255,255,255,.92)'; x.font = '600 13px Inter'; x.letterSpacing = '3px';
  x.fillText(`TENERIFE  ·  ${String(step).padStart(2, '0')} / ${String(total).padStart(2, '0')}`, X, Y);
  x.letterSpacing = '0px'; x.font = 'italic 600 42px "Crimson Text"'; x.fillStyle = '#fff'; x.fillText(name, X, Y + 42);
  if (sub) { x.font = '300 16px Inter'; x.fillStyle = 'rgba(255,255,255,.9)'; x.fillText(sub, X, Y + 66); }
  x.shadowBlur = 0; x.fillStyle = 'rgba(255,255,255,.85)'; x.fillRect(X, Y + 10, lerp(0, 60, smooth(0.4, 1.4, u)), 1.5);
  x.restore();
}

// ---------- précalculs (étoiles, grain) ----------
const STARS = (() => { const R = rand(7); return Array.from({ length: 900 }, () => { const a = R(), b = R(); const band = R() < 0.55; const X = a * W, Y = band ? (b - 0.5) * 120 + 470 - X * 0.5 + (R() - 0.5) * 60 : b * 520; return [X, Y, R() * 1.3 + 0.2, R(), band]; }); })();
const GRAIN = (() => { const c = document.createElement('canvas'); c.width = 256; c.height = 256; const g = c.getContext('2d'), d = g.createImageData(256, 256), R = rand(3); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (R() - 0.5) * 70; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); return c; })();

// =====================================================================
//  LES SCÈNES (u = temps dans la scène, D = durée)
// =====================================================================
function sIntro(u, D) {
  x.fillStyle = vgrad([[0, '#0f3b4d'], [1, '#08202c']]); x.fillRect(0, 0, W, H);
  glow(480, 300, 420, '#2f7d8f', 0.35);
  // l'île (contour simplifié, vue du dessus) avec un léger relief
  const ISLE = [[160, 330], [190, 285], [245, 270], [300, 290], [370, 292], [440, 280], [505, 272], [570, 252], [635, 218], [700, 186], [760, 158], [820, 134], [870, 128], [880, 148], [840, 174], [782, 208], [730, 252], [690, 306], [660, 364], [632, 428], [600, 482], [562, 526], [520, 560], [482, 572], [448, 560], [408, 524], [360, 486], [306, 452], [252, 424], [204, 394]];
  x.save(); x.globalAlpha = smooth(0, 0.9, u);
  x.shadowColor = 'rgba(0,0,0,.4)'; x.shadowBlur = 30; x.fillStyle = '#e9dcc0'; x.beginPath(); ISLE.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); x.fill(); x.shadowBlur = 0;
  x.save(); x.clip();
  const rg = x.createRadialGradient(455, 380, 10, 455, 380, 230); rg.addColorStop(0, '#9b7a5e'); rg.addColorStop(0.45, '#c8b08a'); rg.addColorStop(1, 'rgba(233,220,192,0)'); x.fillStyle = rg; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(110,150,90,.35)'; x.beginPath(); x.ellipse(800, 160, 110, 34, -0.5, 0, 7); x.fill(); x.beginPath(); x.ellipse(220, 320, 70, 34, 0.3, 0, 7); x.fill();
  x.restore();
  x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 2; x.beginPath(); ISLE.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); x.stroke();
  // le Teide
  x.fillStyle = '#6b4c38'; x.beginPath(); x.moveTo(430, 392); x.lineTo(455, 360); x.lineTo(480, 392); x.fill(); x.fillStyle = '#fff'; x.beginPath(); x.moveTo(449, 368); x.lineTo(455, 360); x.lineTo(461, 368); x.fill();
  // l'itinéraire, dans l'ordre du voyage : plage, Teide (soleil puis étoiles), Siam Park, canyon, Anaga, parapente, Santiago del Teide, Masca
  const R = [[290, 470], [455, 372], [262, 440], [540, 300], [800, 160], [570, 330], [255, 365], [205, 330]];
  const k = smooth(0.8, D - 0.4, u) * (R.length - 1);
  x.setLineDash([6, 8]); x.strokeStyle = '#e0283f'; x.lineWidth = 3;
  const seg = (a, b, f) => { const cx = (a[0] + b[0]) / 2 + (b[1] - a[1]) * 0.25, cy = (a[1] + b[1]) / 2 - (b[0] - a[0]) * 0.25; x.beginPath(); x.moveTo(...a); for (let q = 0.05; q <= f + 1e-6; q += 0.05) { const m = 1 - q; x.lineTo(m * m * a[0] + 2 * m * q * cx + q * q * b[0], m * m * a[1] + 2 * m * q * cy + q * q * b[1]); } x.stroke(); };
  for (let i = 0; i < R.length - 1 && i < k; i++) seg(R[i], R[i + 1], Math.min(1, k - i)); x.setLineDash([]);
  R.forEach(([a, b], i) => { if (i <= k + 0.01) { x.fillStyle = '#fff'; circ(a, b, 6); x.fillStyle = '#e0283f'; circ(a, b, 3.5); } });
  x.restore();
  // titre
  const ta = smooth(0.2, 1.2, u);
  x.save(); x.globalAlpha = ta; x.textAlign = 'center'; x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 18;
  x.font = 'italic 600 72px "Crimson Text"'; x.fillText('Tenerife', W / 2, 108);
  x.font = '300 18px Inter'; x.letterSpacing = '6px'; x.fillText('AOÛT 2026', W / 2, 142); x.restore();
}

function sPlage(u, D) {
  const dive = smooth(2.9, 3.7, u); // 0 = plage, 1 = sous l'eau
  if (dive < 1) {
    x.save(); x.translate(0, -dive * H);
    x.fillStyle = vgrad([[0, '#3f8fd6'], [0.55, '#9fd0f2'], [0.7, '#e6f3fa']], 0, 330); x.fillRect(0, 0, W, 340);
    glow(230, 90, 260, '#fff6d8', 0.75); x.fillStyle = '#fffbe9'; circ(230, 90, 26);
    // le Teide au loin dans la brume
    teide(720, 300, 170, 150, 'rgba(140,165,190,.55)', 'rgba(255,255,255,.6)');
    // la mer
    x.fillStyle = vgrad([[0, '#1f6fa8'], [0.6, '#2b9ec4'], [1, '#5fd0d6']], 290, 430); x.fillRect(0, 290, W, 150);
    for (let i = 0; i < 70; i++) { const X = (i * 137.5 + u * 18 * (1 + (i % 3))) % W, Y = 296 + (i * 53) % 120; x.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.5 * Math.abs(Math.sin(u * 3 + i))) + ')'; x.fillRect(X, Y, 8 + (i % 5) * 4, 1.5); }
    // vagues qui montent sur le sable
    const wv = (u * 0.45) % 1;
    x.fillStyle = '#e9cf98'; x.beginPath(); x.moveTo(0, 430); for (let X = 0; X <= W; X += 20) x.lineTo(X, 422 + Math.sin(X / 110) * 8); x.lineTo(W, H); x.lineTo(0, H); x.fill();
    x.fillStyle = 'rgba(160,130,90,.35)'; x.beginPath(); x.moveTo(0, 430); for (let X = 0; X <= W; X += 20) x.lineTo(X, 430 + Math.sin(X / 110) * 8 + 18 * Math.sin(wv * Math.PI)); x.lineTo(W, 470); x.lineTo(0, 470); x.fill();
    x.fillStyle = 'rgba(255,255,255,.75)'; x.beginPath(); for (let X = 0; X <= W; X += 20) x.lineTo(X, 424 + Math.sin(X / 110) * 8 + 26 * Math.sin(wv * Math.PI) + Math.sin(X / 23 + u) * 2); for (let X = W; X >= 0; X -= 20) x.lineTo(X, 418 + Math.sin(X / 110) * 8 + 22 * Math.sin(wv * Math.PI)); x.fill();
    const R = rand(5); for (let i = 0; i < 260; i++) { x.fillStyle = 'rgba(150,110,60,' + R() * 0.25 + ')'; x.fillRect(R() * W, 470 + R() * 170, 2, 2); }
    // palmiers en contre-jour à droite
    palm(860, 640, 1.3, Math.sin(u * 0.9) * 6, 'rgba(40,70,50,.95)'); palm(940, 600, 1.0, Math.sin(u * 0.8 + 1) * 5, 'rgba(40,70,50,.85)');
    // la serviette et le couple, de dos, qui regarde la mer
    x.fillStyle = '#e8577a'; x.beginPath(); x.moveTo(380, 560); x.lineTo(560, 556); x.lineTo(578, 598); x.lineTo(372, 604); x.fill(); x.fillStyle = 'rgba(255,255,255,.6)'; for (let i = 0; i < 5; i++) x.fillRect(388 + i * 38, 557, 12, 44);
    figure({ X: 435, Y: 585, s: 1.15, who: 'v', top: '#e9b796', bot: '#2a5a8a', pose: { sit: 1, a1: 0.5, a2: -0.3 } });
    figure({ X: 478, Y: 586, s: 1.08, who: 'c', top: '#e8577a', bot: '#e9b796', pose: { sit: 1, a1: 0.4, a2: 0.2, rot: -0.12, wind: Math.sin(u * 2) * 1.5 } });
    // mouettes
    for (let i = 0; i < 3; i++) { const X = (300 + i * 90 + u * 30) % W, Y = 150 + i * 22 + Math.sin(u * 2 + i) * 6; x.strokeStyle = 'rgba(40,50,70,.7)'; x.lineWidth = 2; x.beginPath(); x.moveTo(X - 9, Y); x.quadraticCurveTo(X - 4, Y - 6 - Math.sin(u * 8 + i) * 3, X, Y); x.quadraticCurveTo(X + 4, Y - 6 - Math.sin(u * 8 + i) * 3, X + 9, Y); x.stroke(); }
    x.restore();
  }
  if (dive > 0) { // sous l'eau : snorkeling avec une tortue
    const v = u - 2.9;
    x.save(); x.translate(0, (1 - dive) * H);
    x.fillStyle = vgrad([[0, '#3fc0dd'], [0.45, '#1784b5'], [1, '#08355f']]); x.fillRect(0, 0, W, H);
    x.save(); x.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 7; i++) { const a = 80 + i * 140 + Math.sin(v * 0.7 + i) * 30; const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(200,250,255,.22)'); g.addColorStop(1, 'rgba(200,250,255,0)'); x.fillStyle = g; x.beginPath(); x.moveTo(a, 0); x.lineTo(a + 50, 0); x.lineTo(a - 60, H); x.lineTo(a - 150, H); x.fill(); }
    x.restore();
    // surface ondulée vue de dessous
    x.fillStyle = 'rgba(220,255,255,.35)'; x.beginPath(); x.moveTo(0, 0); for (let X = 0; X <= W; X += 12) x.lineTo(X, 18 + Math.sin(X / 40 + v * 3) * 5); x.lineTo(W, 0); x.fill();
    // fond rocheux et caustiques
    x.fillStyle = '#c7b48a'; x.beginPath(); x.moveTo(0, 580); for (let X = 0; X <= W; X += 30) x.lineTo(X, 575 + Math.sin(X / 80) * 14); x.lineTo(W, H); x.lineTo(0, H); x.fill();
    x.fillStyle = '#26303a'; [[90, 600, 120, 70], [620, 610, 160, 80], [880, 590, 90, 60]].forEach(([a, b, w, h]) => { x.beginPath(); x.ellipse(a, b, w, h, 0, Math.PI, 0); x.fill(); });
    x.save(); x.globalCompositeOperation = 'lighter'; x.strokeStyle = 'rgba(255,255,220,.18)'; x.lineWidth = 2; for (let i = 0; i < 14; i++) { x.beginPath(); for (let X = 0; X <= W; X += 20) x.lineTo(X, 590 + i * 4 + Math.sin(X / 25 + v * 4 + i * 2) * 3); x.stroke(); } x.restore();
    // poissons
    for (let i = 0; i < 26; i++) { const X = (i * 61 + v * (40 + (i % 4) * 15)) % (W + 60) - 30, Y = 220 + (i % 7) * 38 + Math.sin(v * 2 + i) * 6; x.fillStyle = ['#ffd75a', '#9fe6ff', '#ffb070'][i % 3]; x.beginPath(); x.ellipse(X, Y, 9, 4, 0, 0, 7); x.fill(); x.beginPath(); x.moveTo(X - 8, Y); x.lineTo(X - 15, Y - 4); x.lineTo(X - 15, Y + 4); x.fill(); }
    // la tortue verte qui plane
    const tx = lerp(1000, 300, smooth(0, 3.4, v)), ty = 400 + Math.sin(v * 1.2) * 12, fl = Math.sin(v * 2.2) * 0.45;
    x.save(); x.translate(tx, ty); x.rotate(-0.08);
    x.fillStyle = '#6f8f55'; [[-30, -26, -fl], [-30, 26, fl], [40, -22, fl * 0.5], [40, 22, -fl * 0.5]].forEach(([a, b, r]) => { x.save(); x.translate(a, b); x.rotate(r + (b < 0 ? -0.9 : 0.9) * (a < 0 ? 1 : 0.5)); x.beginPath(); x.ellipse(0, b < 0 ? -26 : 26, 14, a < 0 ? 40 : 22, 0, 0, 7); x.fill(); x.restore(); });

function sParapente(u, D) {
  const k = u / D;
  x.fillStyle = vgrad([[0, '#1d5fb4'], [0.55, '#78b6ec'], [1, '#d6ecfb']]); x.fillRect(0, 0, W, H);
  glow(150, 80, 300, '#fffbe6', 0.6);
  // le Teide qui dépasse de la mer de nuages, au loin
  teide(250 - k * 60, 420 + k * 40, 210, 230, '#7d5e4c', '#f4eee8');
  x.fillStyle = 'rgba(160,190,220,.35)'; x.fillRect(0, 300, W, 200);
  // la côte qui apparaît en dessous à la fin de la descente
  const sea = smooth(0.45, 1, k);
  cloudBank(470 + sea * 120, u, 8, '#ffffff', '#c8d8ea', 41, 1.1);
  if (sea > 0) { x.save(); x.globalAlpha = sea; x.fillStyle = vgrad([[0, '#2a8fc9'], [1, '#155f94']], 560, H); x.fillRect(0, 580, W, 60); x.fillStyle = '#c9b07a'; x.beginPath(); x.moveTo(0, 598); x.bezierCurveTo(300, 575, 600, 605, W, 585); x.lineTo(W, 600); x.bezierCurveTo(600, 615, 300, 595, 0, 610); x.fill(); x.restore(); }
  cloudBank(530 + sea * 120, u, 14, '#ffffff', '#b9cce2', 42, 1.4);
  // les deux parapentes en tandem
  const wing = (X, Y, c1, c2, who, col, sc) => {
    const span = 150 * sc;
    const g = x.createLinearGradient(X - span, 0, X + span, 0); g.addColorStop(0, c1); g.addColorStop(0.5, c2); g.addColorStop(1, c1);
    x.fillStyle = g; x.beginPath(); x.moveTo(X - span, Y - 150 * sc); x.bezierCurveTo(X - span * 0.6, Y - 205 * sc, X + span * 0.6, Y - 205 * sc, X + span, Y - 150 * sc); x.bezierCurveTo(X + span * 0.6, Y - 178 * sc, X - span * 0.6, Y - 178 * sc, X - span, Y - 150 * sc); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 1; for (let i = -4; i <= 4; i++) { x.beginPath(); x.moveTo(X + i * span / 5, Y - 186 * sc + Math.abs(i) * 6 * sc); x.lineTo(X + i * span / 5, Y - 166 * sc + Math.abs(i) * 4 * sc); x.stroke(); }
    x.strokeStyle = 'rgba(40,40,60,.35)'; for (let i = -4; i <= 4; i++) { x.beginPath(); x.moveTo(X + i * span / 4.5, Y - 162 * sc + Math.abs(i) * 3 * sc); x.lineTo(X, Y - 42 * sc); x.stroke(); }
    figure({ X: X + 6 * sc, Y: Y, s: 0.75 * sc, who: 'v', top: '#2a2f3a', bot: '#2a2f3a', helmet: '#333', pose: { sit: 1, a1: 2.7, a2: 2.7 } });
    figure({ X: X - 10 * sc, Y: Y - 6 * sc, s: 0.75 * sc, who, top: col, bot: '#26365e', helmet: '#ffffff', pose: { sit: 1, a1: 1.6 + Math.sin(u * 3) * 0.2, a2: 1.4 } });
  };
  const px = lerp(260, 640, k), py = lerp(230, 330, k) + Math.sin(u * 1.3) * 8;
  wing(px, py, '#ff4f6e', '#ffd166', 'c', '#e8577a', 1);
  wing(px + 210, py + 70 + Math.sin(u * 1.1 + 1) * 8, '#2a8fd9', '#9ff0ff', 'v', '#c0392b', 0.8);
  for (let i = 0; i < 3; i++) { const X = 700 - u * 40 + i * 30, Y = 120 + i * 14; x.strokeStyle = 'rgba(30,40,60,.6)'; x.lineWidth = 1.6; x.beginPath(); x.moveTo(X - 7, Y); x.quadraticCurveTo(X - 3, Y - 5, X, Y); x.quadraticCurveTo(X + 3, Y - 5, X + 7, Y); x.stroke(); }
}

function sSantiago(u, D) {
  x.fillStyle = vgrad([[0, '#5aa2df'], [1, '#f6e7c8']], 0, 420); x.fillRect(0, 0, W, H);
  glow(760, 110, 260, '#fff3d0', 0.6);
  teide(640, 330, 150, 170, 'rgba(120,100,95,.55)', 'rgba(255,255,255,.55)');
  // collines volcaniques sombres (coulée du Chinyero) et collines cultivées
  ridge(360, 50, 2.1, 0.008, '#5a4a44'); ridge(400, 40, 4.4, 0.01, '#6e6650');
  const R = rand(51); for (let i = 0; i < 18; i++) { const X = R() * W, Y = 395 + R() * 40; x.fillStyle = '#5c4a3a'; x.fillRect(X - 2, Y - 14, 4, 16); x.fillStyle = i % 3 ? '#f4d5de' : '#ffffff'; circ(X, Y - 18, 10); } // amandiers

  const CX = 470, CY = 520;
  x.fillStyle = vgrad([[0, '#ffffff'], [1, '#e5e1d8']], CY - 150, CY); x.fillRect(CX - 170, CY - 120, 340, 120);
  const dome = (X, Y, r) => { const g = x.createRadialGradient(X - r * 0.35, Y - r * 0.6, r * 0.1, X, Y, r * 1.1); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cfcac0'); x.fillStyle = g; x.beginPath(); x.arc(X, Y, r, Math.PI, 0); x.fill(); x.fillStyle = '#e9e5dc'; x.fillRect(X - r - 4, Y - 2, 2 * r + 8, 8); x.fillStyle = '#d8d2c6'; x.fillRect(X - 2, Y - r - 12, 4, 12); x.fillRect(X - 6, Y - r - 8, 12, 3); };
  x.fillStyle = '#f7f5f0'; x.fillRect(CX - 60, CY - 175, 120, 60); dome(CX, CY - 175, 52);
  dome(CX - 120, CY - 120, 34); dome(CX + 120, CY - 120, 34);
  // clocher-mur et portail
  x.fillStyle = '#ffffff'; x.fillRect(CX - 210, CY - 170, 60, 170); x.fillStyle = '#3a3a3a'; x.beginPath(); x.arc(CX - 180, CY - 135, 12, Math.PI, 0); x.fill(); x.fillRect(CX - 192, CY - 135, 24, 16);
  x.fillStyle = '#6b4a2a'; x.beginPath(); x.roundRect(CX - 22, CY - 70, 44, 70, [22, 22, 0, 0]); x.fill();
  x.fillStyle = '#5a3a20'; x.fillRect(CX + 40, CY - 92, 90, 8); for (let i = 0; i < 9; i++) x.fillRect(CX + 44 + i * 10, CY - 84, 3, 22); // balcon canarien en bois
  // la place, un palmier, le couple qui se promène
  x.fillStyle = '#d9cbb0'; x.fillRect(0, CY, W, H - CY); x.fillStyle = 'rgba(0,0,0,.06)'; for (let i = 0; i < 10; i++) x.fillRect(0, CY + 8 + i * 12, W, 1);
  palm(150, 560, 1.2, Math.sin(u) * 4, '#2f5a3a'); palm(810, 560, 1.05, Math.sin(u + 2) * 4, '#2f5a3a');
  const wx = lerp(560, 690, u / D), st = Math.sin(u * 5) * 0.3;
  figure({ X: wx, Y: 600, s: 1.1, who: 'c', top: '#f2a65a', bot: '#3a3f5a', pose: { l1: st, l2: -st, a1: 0.2, a2: -0.5 } });
  figure({ X: wx + 32, Y: 600, s: 1.18, who: 'v', top: '#ffffff', bot: '#26365e', pose: { l1: -st, l2: st, a1: -0.5, a2: 0.2 } });
}

function sMasca(u, D) {
  const k = u / D;
  x.fillStyle = vgrad([[0, '#f0a35c'], [0.5, '#f8cf8a'], [1, '#fbe6bf']], 0, 380); x.fillRect(0, 0, W, H);
  glow(140, 230, 320, '#fff0c0', 0.55);
  // l'océan au bout du ravin et La Gomera à l'horizon
  x.fillStyle = vgrad([[0, '#6a8fb0'], [1, '#3a6a92']], 300, 380); x.fillRect(0, 300, W, 120);
  x.fillStyle = 'rgba(110,120,150,.6)'; x.beginPath(); x.ellipse(170, 302, 120, 16, 0, Math.PI, 0); x.fill();
  // les crêtes acérées du Teno, couche par couche
  const crest = (pts, col) => { x.fillStyle = col; x.beginPath(); x.moveTo(-10, H + 10); pts.forEach(([a, b]) => x.lineTo(a, b)); x.lineTo(W + 10, H + 10); x.fill(); };
  crest([[-10, 330], [80, 300], [160, 340], [260, 250], [330, 320], [420, 270], [520, 330], [620, 230], [700, 300], [800, 210], [880, 290], [970, 250]], '#a3876e');
  crest([[-10, 400], [90, 330], [170, 390], [250, 300], [330, 380], [380, 330], [460, 420], [560, 360], [640, 410], [740, 330], [830, 390], [970, 340]], '#7e6a4e');
  // le Roque (pointu) à côté du village
  x.fillStyle = '#5d4a35'; x.beginPath(); x.moveTo(560, 470); x.lineTo(610, 250); x.lineTo(625, 240); x.lineTo(660, 470); x.fill();
  x.fillStyle = 'rgba(255,200,130,.35)'; x.beginPath(); x.moveTo(610, 250); x.lineTo(625, 240); x.lineTo(605, 470); x.lineTo(585, 470); x.fill();
  crest([[-10, 520], [120, 440], [260, 480], [380, 430], [470, 460], [560, 420], [680, 470], [800, 430], [970, 500]], '#4f5a38');
  // le village sur son éperon : maisons en pierre, toits de tuiles, palmiers
  const R = rand(61);
  for (let i = 0; i < 11; i++) { const X = 380 + i * 22 + R() * 8, Y = 455 - Math.sin(i / 10 * Math.PI) * 26 + R() * 6; x.fillStyle = '#b9a58a'; x.fillRect(X, Y - 14, 18, 14); x.fillStyle = '#b5502e'; x.beginPath(); x.moveTo(X - 2, Y - 14); x.lineTo(X + 9, Y - 22); x.lineTo(X + 20, Y - 14); x.fill(); x.fillStyle = '#3a2a20'; x.fillRect(X + 7, Y - 8, 4, 8); }
  for (let i = 0; i < 6; i++) palm(360 + i * 48 + R() * 10, 470 - R() * 10, 0.32, Math.sin(u + i) * 2, '#2f4f2e');
  // la route en lacets
  x.strokeStyle = 'rgba(230,220,200,.8)'; x.lineWidth = 3; x.beginPath(); x.moveTo(820, 300); x.bezierCurveTo(760, 330, 860, 360, 780, 380); x.bezierCurveTo(700, 400, 820, 430, 720, 440); x.bezierCurveTo(640, 450, 700, 470, 600, 470); x.stroke();
  // le mirador au premier plan : muret en pierre et le couple accoudé, de dos
  x.fillStyle = '#2e2618'; x.fillRect(0, 560, W, 80);
  x.fillStyle = '#6e5c44'; x.fillRect(0, 548, W, 20); for (let i = 0; i < 24; i++) { x.strokeStyle = 'rgba(0,0,0,.2)'; x.lineWidth = 1; x.strokeRect(i * 42, 548, 42, 20); }
  figure({ X: 430, Y: 600, s: 1.35, who: 'c', top: '#e8577a', bot: '#3a3f5a', pose: { a1: 0.9, a2: -0.5, wind: Math.sin(u * 1.4) * 2 } });
  figure({ X: 470, Y: 600, s: 1.45, who: 'v', top: '#3a6aa0', bot: '#26365e', pose: { a1: -0.5, a2: 0.9 } });
  // lumière dorée du soir
  x.save(); x.globalCompositeOperation = 'soft-light'; x.fillStyle = 'rgba(255,170,80,' + (0.25 + k * 0.15) + ')'; x.fillRect(0, 0, W, H); x.restore();
}

function sOutro(u, D) {
  x.fillStyle = vgrad([[0, '#141a30'], [1, '#2a1a2c']]); x.fillRect(0, 0, W, H);
  const R = rand(71); x.save(); x.globalCompositeOperation = 'lighter'; for (let i = 0; i < 22; i++) glow(R() * W, R() * H + Math.sin(u * 0.6 + i) * 10, 30 + R() * 50, ['#ff9a6a', '#ffd36b', '#9ab8ff'][i % 3], 0.12); x.restore();
  // la vraie photo, en polaroïd
  const a = smooth(0.2, 1.2, u), z = lerp(0.96, 1.02, u / D);
  x.save(); x.globalAlpha = a; x.translate(W / 2, 270); x.rotate(-0.035); x.scale(z, z);
  const pw = 430, ph = 288;
  x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 30; x.shadowOffsetY = 12; x.fillStyle = '#fbf8f2'; x.fillRect(-pw / 2 - 16, -ph / 2 - 16, pw + 32, ph + 86); x.shadowBlur = 0; x.shadowOffsetY = 0;
  const im = IMG.photo; if (im) { const s = Math.max(pw / im.width, ph / im.height); x.save(); x.beginPath(); x.rect(-pw / 2, -ph / 2, pw, ph); x.clip(); x.drawImage(im, -im.width * s / 2, -im.height * s / 2 + 10, im.width * s, im.height * s); x.restore(); }
  x.fillStyle = '#3a3040'; x.font = 'italic 600 26px "Crimson Text"'; x.textAlign = 'center'; x.fillText('Tenerife · août 2026', 0, ph / 2 + 46);
  x.restore();
  const b = smooth(1.6, 2.6, u); x.save(); x.globalAlpha = b; x.textAlign = 'center'; x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 12;
  x.font = 'italic 600 34px "Crimson Text"'; x.fillText('Notre plus beau voyage ❤', W / 2, 600); x.restore();
}

// ---------- le montage ----------
const SC = [ // [fonction, durée, nom affiché, sous-titre]
  [sIntro, 4.6, null],
  [sPlage, 6.4, 'La plage', 'Le sable chaud, puis les tortues sous l’eau'],
  [sCoucher, 5.6, 'Coucher de soleil sur le Teide', 'Au-dessus de la mer de nuages'],
  [sEtoiles, 6.2, 'Sous les étoiles', 'La Voie lactée, au pied du Teide'],
  [sSiam, 5.2, 'Siam Park', 'La Tower of Power et la Wave Palace'],
  [sRappel, 5.2, 'Descente en rappel', 'Entre les parois de cendres volcaniques'],
  [sAnaga, 5.4, 'La forêt d’Anaga', 'La laurisylve et sa brume'],
  [sParapente, 5.6, 'Parapente', 'Depuis les pentes du Teide, au-dessus des nuages'],
  [sSantiago, 5.0, 'Santiago del Teide', 'L’église San Fernando Rey et ses coupoles blanches'],
  [sMasca, 5.8, 'Masca', 'Le village perché dans les montagnes du Teno'],
  [sOutro, 6.0, null],
];
const XF = 0.9; // fondu enchaîné entre deux étapes
const PLAN = []; { let t = 0; SC.forEach(([f, d, n, sub], i) => { PLAN.push({ f, t0: t, t1: t + d, n, sub, step: i }); t += d - XF; }); }
const DUR = PLAN[PLAN.length - 1].t1;
const NSTEP = SC.filter(s => s[2]).length;
function renderScene(p, t, ctx) {
  x = ctx; const u = t - p.t0, D = p.t1 - p.t0;
  x.save(); x.clearRect(0, 0, W, H);
  // léger travelling (zoom lent) pour donner vie à chaque plan
  const z = 1 + 0.05 * (u / D); x.translate(W / 2, H / 2); x.scale(z, z); x.translate(-W / 2, -H / 2);
  x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.lineCap = 'butt'; x.setLineDash([]); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  p.f(u, D);
  x.restore();
  if (p.n) placeCard(p.step, NSTEP, p.n, p.sub, u, D);
}
function draw(t) {
  const act = PLAN.filter(p => t >= p.t0 && t < p.t1);
  M.globalAlpha = 1; M.fillStyle = '#000'; M.fillRect(0, 0, W, H);
  act.forEach((p, i) => {
    const buf = i ? bufB : bufA; renderScene(p, t, buf.getContext('2d'));
    const a = i ? smooth(p.t0, p.t0 + XF, t) : 1; M.globalAlpha = a; M.drawImage(buf, 0, 0); M.globalAlpha = 1;
  });
  // finitions : vignette, grain, fondus d'ouverture et de fermeture
  const vg = M.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.7); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.42)'); M.fillStyle = vg; M.fillRect(0, 0, W, H);
  M.save(); M.globalAlpha = 0.05; M.globalCompositeOperation = 'overlay'; const ox = Math.floor(t * 97) % 256, oy = Math.floor(t * 61) % 256; for (let X = -ox; X < W; X += 256) for (let Y = -oy; Y < H; Y += 256) M.drawImage(GRAIN, X, Y); M.restore();
  if (t < 0.8) { M.fillStyle = 'rgba(0,0,0,' + (1 - t / 0.8) + ')'; M.fillRect(0, 0, W, H); }
  if (t > DUR - 1.2) { M.fillStyle = 'rgba(0,0,0,' + clamp((t - (DUR - 1.2)) / 1.2, 0, 1) + ')'; M.fillRect(0, 0, W, H); }
}
window.draw = draw; window.DUR = DUR; window.PLAN = PLAN.map(p => [p.n, +p.t0.toFixed(2), +p.t1.toFixed(2)]);
</script></body></html>
