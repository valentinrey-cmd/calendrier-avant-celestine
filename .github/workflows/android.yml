name: Appli Android
on:
  push:
    branches: [main]
    paths: ['android/**', '2026/index.html', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copie du calendrier dans l'appli (secours hors-ligne)
        run: cp 2026/index.html 2026/icon-*.png android/app/src/main/assets/
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publication sur le site
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk 2026/avent.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add 2026/avent.apk
          git commit -m "APK Android mis à jour [skip ci]" || exit 0
          git pull --rebase origin main
          git push
