name: Appli Suivi
on:
  push:
    branches: [main]
    paths: ['android-suivi/**', '.github/workflows/android-suivi.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk-suivi, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        working-directory: android-suivi
        run: gradle assembleRelease --no-daemon
      - name: Publication sur le site
        run: |
          cp android-suivi/app/build/outputs/apk/release/app-release.apk suivi/suivi.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add suivi/suivi.apk
          git commit -m "APK Suivi mis à jour [skip ci]" || exit 0
          git pull --rebase origin main
          git push
